name: Refresh Lattice set metadata and rulings

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Refresh and verify the snapshot
        run: |
          python3 site_data.py refresh
          python3 site_data.py build
          python3 prepare_pages.py "/${GITHUB_REPOSITORY#*/}"
          node verify_site.mjs "/${GITHUB_REPOSITORY#*/}"
      - name: Push a snapshot branch for review
        run: |
          git add snapshots/site-data.json.xz
          if git diff --cached --quiet; then
            echo "The pinned snapshot is already current." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Refresh Scryfall set metadata and official rulings"
          branch="data/refresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "HEAD:refs/heads/$branch"
          printf '[Review and open a pull request](%s/%s/compare/main...%s?expand=1)\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$branch" >> "$GITHUB_STEP_SUMMARY"
