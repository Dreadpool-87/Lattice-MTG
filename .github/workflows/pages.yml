name: Publish Lattice MTG

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'github-pages' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read Pages configuration
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@v5
      - name: Build sets and rulings from the committed snapshot
        run: python3 site_data.py build
      - name: Prepare and verify the static site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path || (github.ref != 'refs/heads/main' && format('/{0}', github.event.repository.name)) || '' }}
        run: |
          python3 prepare_pages.py "$PAGES_BASE_PATH"
          node verify_site.mjs "$PAGES_BASE_PATH"
      - name: Upload the static site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
