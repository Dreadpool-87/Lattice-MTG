name: Publish Lattice MTG

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '15 5 * * 0'
    - cron: '15 6 * * 0'
    - cron: '19 8 22 11 *' # Catch up on the missed Sunday refresh
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Refresh all Scryfall data before publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'github-pages' }}
  cancel-in-progress: false

jobs:
  schedule:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      refresh: ${{ steps.check.outputs.refresh }}
    steps:
      - name: Match the Sunday refresh against Belgian local time
        id: check
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          python3 - <<'PYTHON'
          from datetime import datetime, time, timedelta, timezone
          from os import environ
          from zoneinfo import ZoneInfo

          today = datetime.now(timezone.utc).date()
          sunday = today - timedelta(days=(today.weekday() + 1) % 7)
          minute, hour, *_ = environ["SCHEDULE_CRON"].split()
          planned = datetime.combine(sunday, time(int(hour), int(minute)), timezone.utc)
          brussels = planned.astimezone(ZoneInfo("Europe/Brussels"))
          refresh = (brussels.hour, brussels.minute) == (7, 15)
          if environ["SCHEDULE_CRON"] == "19 8 22 11 *":
              refresh = today.isoformat() == "2026-11-22"

          print(f"Scheduled time in Brussels: {brussels.isoformat()}")
          with open(environ["GITHUB_OUTPUT"], "a") as output:
              print(f"refresh={str(refresh).lower()}", file=output)
          PYTHON

  refresh:
    needs: schedule
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
          ((github.event_name == 'schedule' && needs.schedule.outputs.refresh == 'true') ||
           (github.event_name == 'workflow_dispatch' && inputs.refresh_data)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.snapshot.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - name: Read Pages configuration
        id: refresh-pages
        uses: actions/configure-pages@v5
      - name: Fetch, verify, and commit changed Scryfall snapshots
        id: snapshot
        env:
          PAGES_BASE_PATH: ${{ steps.refresh-pages.outputs.base_path }}
        run: |
          python3 refresh_cards.py
          python3 site_data.py refresh
          git add -A -- dist snapshots/site-data.json.xz
          if git diff --cached --quiet; then
            echo "No Scryfall content changes to publish." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 data_updates.py
          git add -- dist/updates
          python3 site_data.py build
          python3 prepare_pages.py "$PAGES_BASE_PATH"
          node verify_site.mjs "$PAGES_BASE_PATH"
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Refresh Lattice MTG data from Scryfall"
          git push origin HEAD:main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  prepare:
    needs: refresh
    if: >-
      ${{ !cancelled() &&
          ((needs.refresh.result == 'skipped' && github.event_name != 'schedule') ||
           (needs.refresh.result == 'success' && needs.refresh.outputs.commit != '')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.refresh.outputs.commit || github.sha }}
          persist-credentials: false
      - name: Read Pages configuration
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@v5
      - name: Build sets and rulings from the committed snapshot
        run: python3 site_data.py build
      - name: Prepare and verify the static site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path || (github.ref != 'refs/heads/main' && format('/{0}', github.event.repository.name)) || '' }}
        run: |
          python3 prepare_pages.py "$PAGES_BASE_PATH"
          node verify_site.mjs "$PAGES_BASE_PATH"
      - name: Upload the static site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: ${{ !cancelled() && needs.prepare.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
