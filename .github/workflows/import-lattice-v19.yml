name: Import Lattice MTG snapshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-lattice-v19.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify and import the source snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -e dist ]]; then
            echo "Site files already exist."
            exit 1
          fi
          asset_id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft) | .assets[] | select(.name == "Lattice-MTG-v19-source.tar.gz") | .id')
          [[ "$asset_id" =~ ^[0-9]+$ ]]
          archive="$RUNNER_TEMP/Lattice-MTG-v19-source.tar.gz"
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$archive"
          echo "817418cbd17e30fc2cd25bbc2d8fb65a427f5d956dda39edf18093a3e12a525a  $archive" | sha256sum --check
          tar -xzf "$archive" --strip-components=1
          test -f dist/index.html
          test -f dist/cards/index.html
          test -f dist/lookup/manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .gitignore README.md build_*.py index.template.html dist
          git commit -m 'Import the complete Lattice MTG v19 site'
          git push origin HEAD:main
